version: 2
updates:
  - package-ecosystem: "terraform"
    directories:
      - "/infra/bootstrap"
      - "/infra/bootstrap-prod"
      - "/infra/envs/dev"
      - "/infra/envs/prod"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
